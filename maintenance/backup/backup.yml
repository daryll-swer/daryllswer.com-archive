name: Private archive backup template

on:
  schedule:
    - cron: "17 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: private-archive-backup
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && vars.BACKUP_ZERO_PAID_OVERAGE_VERIFIED == 'true' && vars.BACKUP_TOOLING_SHA != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Validate explicit trusted tooling pin
        env:
          TOOLING_SHA: ${{ vars.BACKUP_TOOLING_SHA }}
        run: |
          [[ "$TOOLING_SHA" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]
      - name: Read current public main SHA anonymously
        id: source
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from urllib.request import Request, urlopen
          request = Request(
              "https://api.github.com/repos/daryll-swer/daryllswer.com-archive/git/ref/heads/main",
              headers={"Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"},
          )
          with urlopen(request, timeout=20) as response:
              if response.status != 200:
                  raise SystemExit(f"public GitHub API returned HTTP {response.status}")
              ref = json.load(response)
          sha = ref.get("object", {}).get("sha", "")
          if not isinstance(sha, str) or len(sha) not in (40, 64) or any(c not in "0123456789abcdef" for c in sha):
              raise SystemExit("public main did not return a full commit SHA")
          print(f"source_sha={sha}")
          PY
      - name: Fetch pinned public tooling and source objects anonymously
        env:
          TOOLING_SHA: ${{ vars.BACKUP_TOOLING_SHA }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
        run: |
          git init "$RUNNER_TEMP/tooling"
          git -C "$RUNNER_TEMP/tooling" remote add origin https://github.com/daryll-swer/daryllswer.com-archive.git
          git -C "$RUNNER_TEMP/tooling" fetch --depth=1 origin "$TOOLING_SHA"
          git -C "$RUNNER_TEMP/tooling" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/tooling" rev-parse HEAD)" = "$TOOLING_SHA"
          git -C "$RUNNER_TEMP/tooling" fetch --depth=1 origin "$SOURCE_SHA"
          git -C "$RUNNER_TEMP/tooling" worktree add --detach "$RUNNER_TEMP/public-source" "$SOURCE_SHA"
          test "$(git -C "$RUNNER_TEMP/public-source" rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Prepare and verify snapshot with trusted tooling
        env:
          TOOLING_SHA: ${{ vars.BACKUP_TOOLING_SHA }}
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/backup-transfer"
          python3 "$RUNNER_TEMP/tooling/scripts/backup-preservation.py" prepare \
            --source-repository daryll-swer/daryllswer.com-archive \
            --source-sha "$SOURCE_SHA" \
            --source-checkout "$RUNNER_TEMP/public-source" \
            --tooling-sha "$TOOLING_SHA" \
            --output "$RUNNER_TEMP/backup-transfer/snapshot"
      - name: Upload verified snapshot for one day
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-private-snapshot
          path: ${{ runner.temp }}/backup-transfer/snapshot/
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: true

  publish:
    needs: prepare
    if: github.ref == 'refs/heads/main' && needs.prepare.result == 'success' && vars.BACKUP_ZERO_PAID_OVERAGE_VERIFIED == 'true' && vars.BACKUP_TOOLING_SHA != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out private backup repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch pinned public tooling anonymously
        env:
          TOOLING_SHA: ${{ vars.BACKUP_TOOLING_SHA }}
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_NOSYSTEM: "1"
        run: |
          [[ "$TOOLING_SHA" =~ ^([0-9a-f]{40}|[0-9a-f]{64})$ ]]
          git init "$RUNNER_TEMP/tooling"
          git -C "$RUNNER_TEMP/tooling" remote add origin https://github.com/daryll-swer/daryllswer.com-archive.git
          git -C "$RUNNER_TEMP/tooling" fetch --depth=1 origin "$TOOLING_SHA"
          git -C "$RUNNER_TEMP/tooling" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/tooling" rev-parse HEAD)" = "$TOOLING_SHA"
      - name: Download verified snapshot artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-private-snapshot
          path: ${{ runner.temp }}/backup-transfer/snapshot
      - name: Recheck evidence and atomically publish snapshot only
        env:
          TOOLING_SHA: ${{ vars.BACKUP_TOOLING_SHA }}
        run: |
          python3 "$RUNNER_TEMP/tooling/scripts/backup-preservation.py" publish \
            --payload "$RUNNER_TEMP/backup-transfer/snapshot" \
            --repository . \
            --source-repository daryll-swer/daryllswer.com-archive \
            --tooling-sha "$TOOLING_SHA"
          git add -f -- snapshot
          python3 "$RUNNER_TEMP/tooling/scripts/backup-preservation.py" verify-staged --repository .
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update verified archive snapshot"
            git push origin HEAD
          fi
