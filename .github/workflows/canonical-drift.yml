name: Canonical drift check

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "Bypass frozen_archive no-op for manual recovery verification"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: canonical-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install Python dependencies
        run: python -m pip install --require-hashes -r requirements-lock.txt

      - name: Prepare controlled brand favicon
        id: brand-favicon
        run: |
          make prepare-brand-favicon
          if git diff --quiet -- assets/brand; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check canonical drift
        id: canonical
        env:
          ACTION_PLAN_PATH: ${{ runner.temp }}/canonical-drift-action-plan.json
        run: |
          args=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            args="--force"
          fi
          python3 scripts/check-canonical-drift.py $args --audit-media --action-plan "${{ runner.temp }}/canonical-drift-action-plan.json" --result "${{ runner.temp }}/canonical-drift-result.json"
          python3 - <<'PY'
          import json
          import os

          with open(os.environ["ACTION_PLAN_PATH"], encoding="utf-8") as plan_file:
              audit = json.load(plan_file).get("media_audit", {})
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("### Same-URL media audit\n\n```json\n")
              json.dump(audit, summary, ensure_ascii=False, indent=2, sort_keys=True)
              summary.write("\n```\n")
          PY
          changed="$(python3 -c 'import json; print(str(json.load(open("${{ runner.temp }}/canonical-drift-result.json", encoding="utf-8")).get("eligibility_changed") is True).lower())')"
          echo "eligibility_changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Check external sources
        id: external
        run: |
          python3 scripts/external_source_monitor.py \
            --result "${{ runner.temp }}/external-source-result.json"
          changed="$(python3 -c 'import json; print(str(json.load(open("${{ runner.temp }}/external-source-result.json", encoding="utf-8")).get("eligibility_changed") is True).lower())')"
          echo "eligibility_changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Reconcile canonical drift
        run: |
          python3 scripts/reconcile-canonical-drift.py \
            --action-plan "${{ runner.temp }}/canonical-drift-action-plan.json" \
            --result "${{ runner.temp }}/canonical-drift-reconciliation-result.json"

      - name: Read reconciliation result
        id: reconciliation
        run: |
          changed="$(python3 -c 'import json; print(str(json.load(open("${{ runner.temp }}/canonical-drift-reconciliation-result.json", encoding="utf-8")).get("content_changed") is True).lower())')"
          echo "content_changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Render generated Pages
        id: render-pages
        if: steps.brand-favicon.outputs.changed == 'true' || steps.canonical.outputs.eligibility_changed == 'true' || steps.external.outputs.eligibility_changed == 'true' || steps.reconciliation.outputs.content_changed == 'true'
        run: make render-site

      - name: Verify reconciled canonical state
        if: steps.reconciliation.outputs.content_changed == 'true'
        run: python3 scripts/check-canonical-drift.py --fresh

      - name: Validate public archive
        run: |
          python scripts/validate-mirror.py --offline --no-report
          python scripts/scan-public-safety.py --no-report

      - name: Check workflow changed paths
        run: python scripts/check-workflow-changes.py --action-plan "${{ runner.temp }}/canonical-drift-action-plan.json"

      - name: Commit drift status changes
        run: |
          git add -A -- .
          if git diff --cached --quiet; then
            echo "No archive or generated Pages changes to commit."
            exit 0
          fi
          python scripts/check-workflow-changes.py --staged --action-plan "${{ runner.temp }}/canonical-drift-action-plan.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record canonical drift check"
          git push
