name: Canonical drift check

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "Bypass frozen_archive no-op for manual recovery verification"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: canonical-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Prepare controlled brand favicon
        id: brand-favicon
        run: |
          make prepare-brand-favicon
          if git diff --quiet -- assets/brand; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check canonical drift
        run: |
          args=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            args="--force"
          fi
          python3 scripts/check-canonical-drift.py $args --action-plan "${{ runner.temp }}/canonical-drift-action-plan.json"

      - name: Reconcile canonical drift
        run: |
          python3 scripts/reconcile-canonical-drift.py \
            --action-plan "${{ runner.temp }}/canonical-drift-action-plan.json" \
            --result "${{ runner.temp }}/canonical-drift-reconciliation-result.json"

      - name: Read reconciliation result
        id: reconciliation
        run: |
          changed="$(python3 -c 'import json; print(str(json.load(open("${{ runner.temp }}/canonical-drift-reconciliation-result.json", encoding="utf-8")).get("content_changed") is True).lower())')"
          echo "content_changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Render generated Pages
        if: steps.brand-favicon.outputs.changed == 'true' || steps.reconciliation.outputs.content_changed == 'true'
        run: make render-site

      - name: Verify reconciled canonical state
        if: steps.reconciliation.outputs.content_changed == 'true'
        run: python3 scripts/check-canonical-drift.py --fresh

      - name: Read archive state
        id: archive-state
        run: |
          state="$(python3 -c 'import json; print(json.load(open("archive-status.json", encoding="utf-8")).get("state", ""))')"
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: Validate public archive
        if: steps.archive-state.outputs.state != 'frozen_archive'
        run: |
          make validate
          make scan-secrets

      - name: Check workflow changed paths
        run: |
          python3 - <<'PY'
          import re
          import subprocess
          import sys

          paths = set()
          for command in [
              ["git", "diff", "--name-only"],
              ["git", "diff", "--cached", "--name-only"],
              ["git", "ls-files", "--others", "--exclude-standard"],
          ]:
              paths.update(line for line in subprocess.check_output(command, text=True).splitlines() if line)
          allowed = re.compile(
              r"(?:archive-manifest\.json|archive-status\.json|docs/CANONICAL_DRIFT\.md|"
              r"docs/VALIDATION\.md|docs/PUBLIC_SAFETY\.md|docs/index\.html|docs/\.nojekyll|"
              r"assets/brand/manifest\.json|assets/brand/derivatives/.+|"
              r"docs/assets/.+|docs/posts/.+|docs/sheets/.+|content/posts/.+)"
          )
          unexpected = sorted(path for path in paths if not allowed.fullmatch(path))
          if unexpected:
              print("Unexpected workflow changes:", file=sys.stderr)
              print("\n".join(unexpected), file=sys.stderr)
              raise SystemExit(1)
          print(f"Changed paths are within the canonical archive allowlist ({len(paths)} path(s)).")
          PY

      - name: Commit drift status changes
        run: |
          git add -A -- archive-manifest.json archive-status.json assets/brand/manifest.json assets/brand/derivatives docs/CANONICAL_DRIFT.md docs/index.html docs/.nojekyll docs/assets docs/posts docs/sheets content/posts
          if git diff --cached --quiet; then
            echo "No archive or generated Pages changes to commit."
            exit 0
          fi
          python3 - <<'PY'
          import re
          import subprocess
          import sys

          paths = subprocess.check_output(["git", "diff", "--cached", "--name-only"], text=True).splitlines()
          allowed = re.compile(
              r"(?:archive-manifest\.json|archive-status\.json|docs/CANONICAL_DRIFT\.md|"
              r"assets/brand/manifest\.json|assets/brand/derivatives/.+|"
              r"docs/index\.html|docs/\.nojekyll|docs/assets/.+|docs/posts/.+|docs/sheets/.+|content/posts/.+)"
          )
          unexpected = sorted(path for path in paths if not allowed.fullmatch(path))
          if unexpected:
              print("Unexpected staged paths:", file=sys.stderr)
              print("\n".join(unexpected), file=sys.stderr)
              raise SystemExit(1)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record canonical drift check"
          git push
