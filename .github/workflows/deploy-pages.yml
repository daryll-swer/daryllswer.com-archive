name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Canonical drift check"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages-deployment
  cancel-in-progress: false

jobs:
  build:
    if: >-
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository)) &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    outputs:
      needed: ${{ steps.gate.outputs.needed }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
      - id: gate
        name: Check successful deployment evidence for exact revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REVISION="${{ github.sha }}"
          remote="$(git ls-remote origin refs/heads/main | cut -f1)"
          test -n "$remote" && test "$remote" = "$REVISION"
          python scripts/pages-deployment-gate.py --revision "$REVISION" --repository "${{ github.repository }}" >> "$GITHUB_OUTPUT"
      - name: Set up Python
        if: steps.gate.outputs.needed == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install hash-locked dependencies
        if: steps.gate.outputs.needed == 'true'
        run: python -m pip install --require-hashes -r requirements-lock.txt
      - name: Compile and run regression suite
        if: steps.gate.outputs.needed == 'true'
        run: |
          python scripts/check-requirement-lock.py
          python -m py_compile scripts/*.py tests/*.py
          python -m unittest discover -s tests -v
      - name: Prepare and validate exact revision
        if: steps.gate.outputs.needed == 'true'
        run: |
          make prepare-brand-favicon PYTHON=python
          make render-site PYTHON=python
          python scripts/validate-mirror.py --offline --no-report
          python scripts/scan-public-safety.py --no-report
          git diff --exit-code
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.gate.outputs.needed == 'true'
        with:
          path: docs
  deploy:
    needs: build
    if: needs.build.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
      - name: Recheck current main immediately before deployment
        env:
          REVISION: ${{ github.sha }}
        run: |
          remote="$(git ls-remote origin refs/heads/main | cut -f1)"
          test -n "$remote" && test "$remote" = "$REVISION"
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
