name: Read-only CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes -r requirements-lock.txt
      - name: Check direct requirement and lock consistency
        run: python scripts/check-requirement-lock.py
      - name: Compile Python
        run: python -m py_compile scripts/*.py tests/*.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Offline mirror validation
        run: python scripts/validate-mirror.py --offline --no-report
      - name: Public safety scan
        run: python scripts/scan-public-safety.py --no-report
      - name: Deterministic isolated render
        run: |
          make render-site PYTHON=python
          git diff --exit-code -- docs data
          test -z "$(git ls-files --others --exclude-standard docs data)"
